<style>
:root {
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.8125rem);
  --text-sm: clamp(0.875rem, 0.82rem + 0.25vw, 0.9375rem);
  --text-base: 1rem;
  --text-lg: clamp(1.125rem, 1rem + 0.5vw, 1.375rem);
  --text-xl: clamp(1.375rem, 1.1rem + 1vw, 1.875rem);
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  --sombra: 0 1px 2px rgba(20, 18, 14, .06), 0 4px 16px rgba(20, 18, 14, .06);
  --fonte: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --fundo: #f6f4ef;
  --superficie: #ffffff;
  --superficie-2: #efece5;
  --borda: #e2ddd2;
  --texto: #1d1b17;
  --texto-2: #5f5a50;
  --texto-3: #8a8478;
  --acento: #1f5f5b;
  --acento-texto: #ffffff;
  --acento-suave: #dcebe8;

  --e-novo-bg: #e6ecf7;       --e-novo: #2c4a7c;
  --e-criacao-bg: #ece8f6;    --e-criacao: #523f86;
  --e-entregue-bg: #fbecd2;   --e-entregue: #7a4a06;
  --e-aprovado-bg: #dcefe2;   --e-aprovado: #1f6436;
  --e-refazer-bg: #f8dedb;    --e-refazer: #8f2a1f;
  --e-canva-bg: #e9e6df;      --e-canva: #5b564c;
  --e-cancelado-bg: #ecebe8;  --e-cancelado: #6e6b66;
  --e-programado-bg: #dbeef6; --e-programado: #135a73;
  --e-publicado-bg: #dcefe2;  --e-publicado: #1f6436;
}
[data-tema="escuro"] {
  --fundo: #141412;
  --superficie: #1d1c19;
  --superficie-2: #26251f;
  --borda: #34322b;
  --texto: #f1eee7;
  --texto-2: #b8b2a5;
  --texto-3: #8b8578;
  --acento: #6cc2b8;
  --acento-texto: #0d1f1d;
  --acento-suave: #1d3532;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);

  --e-novo-bg: #1f2a3d;       --e-novo: #a9c2ef;
  --e-criacao-bg: #2a2440;    --e-criacao: #c6b7f0;
  --e-entregue-bg: #3a2c12;   --e-entregue: #f2c46d;
  --e-aprovado-bg: #17311f;   --e-aprovado: #8bd6a2;
  --e-refazer-bg: #3d1d19;    --e-refazer: #f4a49a;
  --e-canva-bg: #2b2925;      --e-canva: #c9c3b6;
  --e-cancelado-bg: #2a2926;  --e-cancelado: #a19d95;
  --e-programado-bg: #142f39; --e-programado: #8fd0e6;
  --e-publicado-bg: #17311f;  --e-publicado: #8bd6a2;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--fonte); font-size: var(--text-base); line-height: 1.5; color: var(--texto); background: var(--fundo); padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { body { padding-bottom: 0; } }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--acento); }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.pular { position: absolute; left: -999px; } .pular:focus { left: 12px; top: 12px; z-index: 99; background: var(--superficie); padding: 8px 12px; border-radius: var(--r-sm); }
.mudo { color: var(--texto-2); }
[hidden] { display: none !important; }

/* Topo */
.topo { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: color-mix(in srgb, var(--fundo) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--borda); }
.topo-marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.logo { width: 30px; height: 30px; color: var(--acento); stroke: none; }
.topo-titulo { font-weight: 700; letter-spacing: -.01em; }
.topo-sub { font-size: var(--text-xs); color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-acoes { display: flex; gap: 8px; align-items: center; }
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--superficie); border-top: 1px solid var(--borda); padding-bottom: env(safe-area-inset-bottom); }
.aba { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 8px; border: 0; background: none; font-size: var(--text-xs); color: var(--texto-3); cursor: pointer; }
.aba.ativa { color: var(--acento); font-weight: 600; }
.aba .contador { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--e-refazer); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }
[data-tema="escuro"] .aba .contador { color: #1d1b17; }
@media (min-width: 900px) {
  .abas { position: static; display: flex; gap: 4px; background: none; border: 0; padding: 0; }
  .aba { flex-direction: row; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: var(--text-sm); }
  .aba.ativa { background: var(--acento-suave); }
  .aba .contador { position: static; }
}
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--borda); background: var(--superficie); font-size: var(--text-sm); font-weight: 600; cursor: pointer; white-space: nowrap; }
.botao:hover { border-color: var(--texto-3); }
.botao:disabled { opacity: .55; cursor: progress; }
.botao-primario { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
.botao-alerta { background: var(--e-refazer); color: #fff; border-color: var(--e-refazer); }
[data-tema="escuro"] .botao-alerta { color: #1d1b17; }
.botao-icone { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--borda); background: var(--superficie); cursor: pointer; }
#btn-atualizar.girando svg { animation: gira 0.9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (max-width: 520px) { #btn-atualizar span { display: none; } #btn-atualizar { width: 40px; padding: 0; } }

/* Conteúdo */
main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 32px; outline: none; }
h1 { font-size: var(--text-xl); line-height: 1.15; letter-spacing: -.02em; margin: 4px 0 4px; }
h2 { font-size: var(--text-lg); line-height: 1.25; margin: 28px 0 12px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
h2 .qtd { font-size: var(--text-sm); color: var(--texto-3); font-weight: 500; }
.intro { color: var(--texto-2); margin: 0 0 18px; font-size: var(--text-sm); }

.contadores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 720px) { .contadores { grid-template-columns: repeat(4, 1fr); } }
.contador-card { text-align: left; padding: 14px; border-radius: var(--r-md); background: var(--superficie); border: 1px solid var(--borda); box-shadow: var(--sombra); cursor: pointer; }
.contador-card .num { font-size: var(--text-xl); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.1; }
.contador-card .rot { font-size: var(--text-xs); color: var(--texto-2); margin-top: 4px; }
.contador-card.destaque { background: var(--e-entregue-bg); border-color: transparent; }
.contador-card.destaque .num { color: var(--e-entregue); }
.contador-card.zero .num { color: var(--texto-3); }

/* Selos */
.selo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: var(--text-xs); font-weight: 650; line-height: 1.4; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.selo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-novo { background: var(--e-novo-bg); color: var(--e-novo); }
.s-em_criacao { background: var(--e-criacao-bg); color: var(--e-criacao); }
.s-entregue, .s-aguardando_aprovo { background: var(--e-entregue-bg); color: var(--e-entregue); }
.s-aprovado { background: var(--e-aprovado-bg); color: var(--e-aprovado); }
.s-refazer { background: var(--e-refazer-bg); color: var(--e-refazer); }
.s-aguardando_canva, .s-rascunho, .s-manual { background: var(--e-canva-bg); color: var(--e-canva); }
.s-cancelado { background: var(--e-cancelado-bg); color: var(--e-cancelado); }
.s-programado { background: var(--e-programado-bg); color: var(--e-programado); }
.s-aguardando_confirmacao, .s-obsoleta { background: var(--e-entregue-bg); color: var(--e-entregue); }
.s-publicado { background: var(--e-publicado-bg); color: var(--e-publicado); }
.s-enviado { background: var(--acento-suave); color: var(--acento); }

/* Cartões de design */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
@media (max-width: 520px) { .grade.duas { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
.cartao { position: relative; display: flex; flex-direction: column; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sombra); }
.cartao-abrir { all: unset; cursor: pointer; display: block; }
.cartao-abrir:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
.miniatura { position: relative; aspect-ratio: 4 / 5; background: var(--superficie-2); overflow: hidden; }
.miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .3s; }
.miniatura img.carregando { opacity: 0; }
.miniatura .sem-img { position: absolute; inset: 0; display: grid; place-items: center; color: var(--texto-3); font-size: var(--text-xs); text-align: center; padding: 12px; }
.miniatura .play { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff; font-size: var(--text-xs); font-weight: 600; }
.miniatura .play svg { width: 14px; height: 14px; fill: #fff; stroke: none; }
.miniatura .selo { position: absolute; top: 10px; left: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.cartao-corpo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cartao-empresa { font-size: var(--text-xs); color: var(--texto-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.cartao-titulo { font-weight: 650; line-height: 1.3; }
.cartao-meta { font-size: var(--text-xs); color: var(--texto-2); }
.cartao-briefing { font-size: var(--text-sm); color: var(--texto-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.cartao-acoes { display: flex; gap: 8px; padding: 0 14px 14px; }
.cartao-acoes .botao { flex: 1; }
.enviado.obsoleta { background: var(--e-entregue-bg); color: var(--e-entregue); }
.enviado { margin: 0 14px 14px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--acento-suave); color: var(--acento); font-size: var(--text-xs); font-weight: 600; }
@media (max-width: 520px) {
  .grade.duas .cartao-corpo { padding: 10px; }
  .grade.duas .cartao-briefing { display: none; }
  .grade.duas .cartao-acoes { padding: 0 10px 10px; flex-direction: column; }
}

/* Filtros */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; align-items: center; }
.filtros input[type="search"], .filtros select { min-height: 40px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--borda); background: var(--superficie); font-size: var(--text-sm); }
.filtros input[type="search"] { flex: 1 1 220px; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; flex: 1 1 100%; }
.chip { flex: none; min-height: 34px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--borda); background: var(--superficie); font-size: var(--text-xs); font-weight: 600; cursor: pointer; color: var(--texto-2); }
.chip[aria-pressed="true"] { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
.vazio { padding: 28px 16px; text-align: center; color: var(--texto-2); background: var(--superficie); border: 1px dashed var(--borda); border-radius: var(--r-md); font-size: var(--text-sm); }

/* Avisos de fonte */
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; margin-bottom: 10px; border-radius: var(--r-md); background: var(--e-refazer-bg); color: var(--e-refazer); font-size: var(--text-sm); }
.aviso.leve { background: var(--e-entregue-bg); color: var(--e-entregue); }

/* Lista de fontes */
.fontes { display: grid; gap: 0; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-md); overflow: hidden; }
.fonte { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--borda); font-size: var(--text-sm); }
.fonte:first-child { border-top: 0; }
.fonte .quando { color: var(--texto-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fonte .erro { color: var(--e-refazer); }
.modulos { display: flex; flex-wrap: wrap; gap: 8px; }
.modulo { padding: 8px 12px; border-radius: var(--r-md); border: 1px dashed var(--borda); color: var(--texto-2); font-size: var(--text-sm); }
.modulo b { display: block; color: var(--texto); font-weight: 600; }

/* Posts */
.raia { margin-bottom: 8px; }
.post { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 12px; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-md); box-shadow: var(--sombra); margin-bottom: 10px; cursor: pointer; text-align: left; width: 100%; }
@media (min-width: 720px) { .post { grid-template-columns: 140px minmax(0, 1fr); } }
.post .miniatura { border-radius: var(--r-sm); }
.post-legenda { font-size: var(--text-sm); color: var(--texto-2); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 4px 0; }
.post-info { font-size: var(--text-xs); color: var(--texto-3); }
.post > div { min-width: 0; }
.post-legenda, .post-info, .bloco-texto { overflow-wrap: anywhere; }
.linha-tempo { position: relative; padding-left: 18px; }
.linha-tempo::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--borda); border-radius: 2px; }
.linha-tempo h2::before { content: ""; position: absolute; left: 0; width: 12px; height: 12px; margin-top: 6px; border-radius: 50%; background: var(--fundo); border: 2px solid var(--texto-3); }
.linha-tempo h2 { position: relative; margin-left: -18px; padding-left: 22px; }

/* Biblioteca */
.midia-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.midia { all: unset; cursor: pointer; display: block; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-md); overflow: hidden; }
.midia .miniatura { aspect-ratio: 1; }
.midia-desc { padding: 8px 10px; font-size: var(--text-xs); color: var(--texto-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag-ia { position: absolute; right: 8px; top: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 700; }
.tag-uso { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 999px; background: var(--acento); color: var(--acento-texto); font-size: 11px; font-weight: 700; }
.produto { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-md); }
.produto .preco { font-weight: 750; font-size: var(--text-lg); color: var(--acento); white-space: nowrap; }

/* Folha de detalhes */
.folha { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 900px) { .folha { align-items: center; } }
.folha-fundo { position: absolute; inset: 0; background: rgba(10, 10, 8, .5); }
.folha-caixa { position: relative; width: 100%; max-width: 920px; max-height: 92vh; overflow: auto; background: var(--superficie); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); animation: sobe .22s ease-out; }
@media (min-width: 900px) { .folha-caixa { border-radius: var(--r-lg); padding: 28px; } }
.caixa-pequena { max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
.caixa-pequena h2 { margin: 0; }
.caixa-pequena textarea { width: 100%; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--borda); background: var(--fundo); resize: vertical; }
.linha-botoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
@keyframes sobe { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .folha-caixa { animation: none; } #btn-atualizar.girando svg { animation: none; } }
.folha-fechar { position: absolute; right: 12px; top: 12px; z-index: 2; }
.detalhe { display: grid; gap: 20px; }
@media (min-width: 900px) { .detalhe { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.detalhe .miniatura { border-radius: var(--r-md); }
.detalhe h1 { padding-right: 44px; }
.detalhe dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; font-size: var(--text-sm); }
.detalhe dt { color: var(--texto-3); }
.detalhe dd { margin: 0; }
.versoes { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
.versao { all: unset; cursor: pointer; flex: none; width: 72px; border-radius: var(--r-sm); overflow: hidden; border: 2px solid transparent; font-size: 11px; text-align: center; color: var(--texto-2); }
.versao[aria-pressed="true"] { border-color: var(--acento); }
.versao .miniatura { aspect-ratio: 4 / 5; }
.historico { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.historico li { padding: 10px 12px; border-radius: var(--r-sm); background: var(--e-refazer-bg); color: var(--e-refazer); font-size: var(--text-sm); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.bloco-texto { white-space: pre-line; font-size: var(--text-sm); background: var(--superficie-2); padding: 12px; border-radius: var(--r-sm); }

/* Esqueleto */
.esqueleto { background: linear-gradient(90deg, var(--superficie-2), var(--borda), var(--superficie-2)); background-size: 200% 100%; animation: brilho 1.2s ease-in-out infinite; border-radius: var(--r-md); }
@keyframes brilho { to { background-position: -200% 0; } }

.aviso-flutuante { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: var(--r-md); width: max-content; max-width: min(92vw, 520px); text-align: center; background: var(--texto); color: var(--fundo); font-size: var(--text-sm); font-weight: 600; box-shadow: var(--sombra); max-width: calc(100% - 32px); }
@media (min-width: 900px) { .aviso-flutuante { bottom: 24px; } }
</style>
